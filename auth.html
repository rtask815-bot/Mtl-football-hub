<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Identity Node | Authentication</title>
    
    <!-- Explicitly whitelist your local files and your specific Supabase endpoint -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://dfcgbwfralikyqxzxlbd.supabase.co https://api.groq.com;">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.6);
            --neon-cyan: #00f5d4;
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-glow: rgba(56, 189, 248, 0.15);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Ambient Canvas Backdrop */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .cursor-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        /* Device Auto-Fit Layout Structure */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 50px rgba(56, 189, 248, 0.03);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-purple), transparent);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 40%, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        #aiText {
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-cyan);
            height: 16px;
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }

        /* Premium Tab Switchers */
        .nav-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-bottom: 28px;
        }

        .nav-switch button {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-switch button.active {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Controls & Form Inputs */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
            background: rgba(3, 7, 18, 0.85);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
            color: var(--neon-blue);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .forgot-password-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
            padding-right: 4px;
        }

        .forgot-password-link {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-password-link:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        #strengthMeter {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background-color: rgba(255, 255, 255, 0.05);
            transition: background-color 0.4s ease;
        }

        /* Buttons Core UI */
        .btn-prime {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #1d4ed8, #0ea5e9);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(29, 78, 216, 0.3);
        }

        .btn-prime:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(14, 165, 233, 0.45);
            filter: brightness(1.15);
        }

        .btn-prime:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 28px 0;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-divider:not(:empty)::before {
            margin-right: 1em;
        }

        .auth-divider:not(:empty)::after {
            margin-left: 1em;
        }

        .btn-secondary-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-alt {
            width: 100%;
            padding: 13px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-alt:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Modernized Component Modal Windows */
        .premium-modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 99999;
            padding: 20px;
        }

        .premium-modal-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.98), rgba(3, 7, 18, 0.99));
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.05);
            color: #ffffff;
            position: relative;
        }

        .premium-modal-card h2 {
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
        }

        /* Global Dynamic Loader Screens */
        #globalProcessLoader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 100000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .spinner-ring {
            width: 56px;
            height: 56px;
            border: 3px solid rgba(56, 189, 248, 0.08);
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loaderText {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* HUD Chat Interfaces */
        #chatLauncherBtn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-purple), #2563eb);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #chatLauncherBtn:hover {
            transform: scale(1.06) rotate(5deg);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.5);
        }

        #aiChatConsole {
            position: fixed;
            bottom: 96px;
            right: 24px;
            width: 380px;
            height: 520px;
            max-width: calc(100vw - 48px);
            max-height: calc(100dvh - 130px);
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            border-radius: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(20px) scale(0.96);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        #aiChatConsole.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .chat-header {
            padding: 18px;
            background: rgba(168, 85, 247, 0.08);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        .chat-title p {
            font-size: 11px;
            color: var(--neon-purple);
            margin-top: 2px;
        }

        #closeChatConsole {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        #chatFeedStream {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.55;
            word-wrap: break-word;
        }

        .bubble-ai {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            color: #f3f4f6;
        }

        .bubble-user {
            background: linear-gradient(135deg, var(--neon-purple), #1d4ed8);
            align-self: flex-end;
            color: #ffffff;
        }

        .chat-input-area {
            padding: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
        }

        #chatUserQuery {
            flex: 1;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 13.5px;
            font-family: 'Inter', sans-serif;
        }

        #chatUserQuery:focus {
            outline: none;
            border-color: var(--neon-purple);
        }

        #chatSendPayloadBtn {
            background: var(--neon-purple);
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            color: #ffffff;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #chatSendPayloadBtn:hover {
            background: #9333ea;
        }

        .typing-indicator span {
            height: 6px;
            width: 6px;
            background: var(--text-muted);
            display: inline-block;
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
            margin: 0 2px;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -1.1s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: -0.9s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1.0);
            }
        }

        /* Small Screen Core Adjustments */
        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            #aiChatConsole {
                right: 16px;
                bottom: 84px;
                width: calc(100vw - 32px);
            }
        }
    </style>
</head>

<body>

    <canvas id="particles"></canvas>
    <div class="cursor-glow"></div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <h1>MTL FOOTBALL PREDICTIONS</h1>
                <div id="aiText">CONNECTING...</div>
            </div>

            <div class="nav-switch">
                <button id="showLoginBtn" class="active">SIGN IN</button>
                <button id="showRegisterBtn">REGISTER</button>
            </div>

            <div id="loginBox">
                <div class="form-group">
                    <label>User Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="name@domain.tech">
                    </div>
                </div>
                <div class="form-group">
                    <label>Cipher Key (password)</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••">
                        <button class="password-toggle" data-target="password" type="button">SHOW</button>
                    </div>
                    <div class="forgot-password-container">
                        <a href="reset_password.html" class="forgot-password-link">RESET PASSWORD</a>
                    </div>
                </div>
                <button id="loginBtn" class="btn-prime">LOGIN</button>
            </div>

            <div id="registerBox" style="display: none;">
                <div class="form-group">
                    <label>USERNAME</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="operator_01">
                    </div>
                </div>
                <div class="form-group">
                    <label>EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" class="form-control" placeholder="operator@domain.tech">
                    </div>
                </div>
                <div class="form-group">
                    <label>PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" class="form-control" placeholder="••••••••">
                        <button class="password-toggle" data-target="regPassword" type="button">SHOW</button>
                    </div>
                    <div id="strengthMeter">
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                    </div>
                </div>
                <button id="registerBtn" class="btn-prime">REGISTER</button>
            </div>

            <div class="auth-divider">ALTERNATIVES</div>

            <div class="btn-secondary-group">
                <button id="googleBtn" class="btn-alt">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <path fill="#currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                        <path fill="#currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                        <path fill="#currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05" />
                        <path fill="#currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335" />
                    </svg>
                    Sign in With Googke
                </button>
                <button onclick="execTwilioVerification()" class="btn-alt">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                    Out-Of-Band OTP Signin
                </button>
            </div>

        </div>
    </div>

    <div id="premiumOtpModal" class="premium-modal-overlay">
        <div class="premium-modal-card">
            <div style="position:absolute; top:-40px; right:-40px; width:120px; height:120px; background: radial-gradient(circle, rgba(56, 189, 248, 0.2), transparent 70%); filter: blur(15px); pointer-events: none;"></div>
            <h2>Identity Validation</h2>
            <p style="font-size:12.5px; color: var(--text-muted); margin-bottom: 20px;">Verification requires multi-factor system checks.</p>

            <div class="form-group">
                <label>Phone number</label>
                <input id="phoneInput" class="form-control" placeholder="+254700000000" />
            </div>
            <div class="form-group">
                <label>User Name</label>
                <input id="nameInput" class="form-control" placeholder="Full Name" />
            </div>

            <button onclick="startOtpFlow()" class="btn-prime" style="margin-bottom: 16px;">Request Token Dispatch</button>
            <div style="height:1px; background:rgba(255,255,255,0.08); margin: 20px 0;"></div>

            <div class="form-group">
                <label>Received Verification Token</label>
                <input id="otpInput" class="form-control" placeholder="Enter 6-digit code" style="border-color: rgba(34,197,94,0.3);" />
            </div>

            <button onclick="verifyOtpFlow()" class="btn-prime" style="background: linear-gradient(90deg, #16a34a, #22c55e); box-shadow: 0 4px 15px rgba(22,163,74,0.3); margin-bottom: 10px;">Verify Node Authorization</button>
            <button onclick="resendOtp()" class="btn-alt" style="font-size:12px; padding:10px; margin-bottom: 10px;">Resend Request</button>
            <button onclick="closeOtpModal()" class="btn-alt" style="background:transparent; border-color:rgba(255,255,255,0.1); font-size:12px; padding:10px; color: var(--text-muted);">Abort Verification</button>
        </div>
    </div>

    <div id="globalProcessLoader">
        <div class="spinner-ring"></div>
        <div id="loaderText">connecting...</div>
    </div>

    <button id="chatLauncherBtn" title="Query Terminal Assistant">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
    </button>

    <div id="aiChatConsole">
        <div class="chat-header">
            <div class="chat-title">
                <h3>ASISTANT</h3>
                <p>AI Support</p>
            </div>
            <button id="closeChatConsole">&times;</button>
        </div>
        <div id="chatFeedStream"></div>
        <div class="chat-input-area">
            <input type="text" id="chatUserQuery" placeholder="Ask Miss Vallery a question..." autocomplete="off">
            <button id="chatSendPayloadBtn">SEND</button>
        </div>
    </div>

        /* =========================================================
        PARTICLES BACKGROUND FX MATRIX ENGINE
        ========================================================= */
        const canvas = $("#particles");
        if (canvas) {
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const particles = [];
            for (let i = 0; i < 85; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    dx: (Math.random() - .5) * 0.4,
                    dy: (Math.random() - .5) * 0.4,
                    size: Math.random() * 1.8 + 0.4
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                    ctx.beginPath();
                    ctx.fillStyle = "rgba(0, 245, 212, 0.2)";
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(168, 85, 247, ${0.05 - dist/2600})`;
                            ctx.lineWidth = 0.8;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
